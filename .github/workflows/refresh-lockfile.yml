name: Refresh dependency lockfile

on:
  push:
    branches:
      - maintenance/dependency-audit-actions

permissions:
  contents: write

concurrency:
  group: clientflow-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Regenerate the lockfile from the reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
