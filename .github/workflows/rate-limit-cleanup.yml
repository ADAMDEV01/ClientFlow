name: Rate limit cleanup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete expired rate-limit buckets
    runs-on: ubuntu-latest
    env:
      # Prisma config requires DATABASE_URL even when generating the client.
      # This placeholder is never used for the cleanup command.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow?schema=public"
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Clean expired buckets
        if: ${{ env.PRODUCTION_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ env.PRODUCTION_DATABASE_URL }}
        run: npm run rate-limit:cleanup
      - name: Skip cleanup when production database is not configured
        if: ${{ env.PRODUCTION_DATABASE_URL == '' }}
        run: echo "::notice::Skipped cleanup because PRODUCTION_DATABASE_URL is not configured."
