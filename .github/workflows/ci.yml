name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: clientflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Lint, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow?schema=public"
      AUTH_SECRET: "ci-only-secret-that-is-at-least-32-characters-long"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"
      SEED_DEMO_PASSWORD: "ci-only-demo-password"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run rate-limit:cleanup
      - name: Temporary Prettier auto-commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/activity-client-portal-archive-completeness'
        run: |
          npx prettier --write src/server/storage/office-archive.ts src/tests/unit/office-archive.test.ts src/tests/unit/analytics.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/storage/office-archive.ts src/tests/unit/office-archive.test.ts src/tests/unit/analytics.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier formatting to changed files"
            git push origin HEAD:refs/heads/fix/activity-client-portal-archive-completeness
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker build --tag clientflow:ci .

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow_integration?schema=public"
      AUTH_SECRET: "ci-only-secret-that-is-at-least-32-characters-long"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientflow_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientflow_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run test:integration

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow_e2e?schema=public"
      AUTH_SECRET: "ci-only-secret-that-is-at-least-32-characters-long"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"
      SEED_DEMO_PASSWORD: "ci-only-demo-password"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientflow_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production bundle for Lighthouse
        run: npm run build
        env:
          NODE_ENV: production
      - name: Start production server for Lighthouse
        run: |
          npm run start > /tmp/clientflow-lighthouse.log 2>&1 &
          echo $! > /tmp/clientflow-lighthouse.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/clientflow-lighthouse.log
          exit 1
        env:
          NODE_ENV: production
      - name: Run Lighthouse audit
        run: |
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -perm -u+x | head -n 1)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Playwright Chromium executable not found."
            exit 1
          fi
          CHROME_PATH="$CHROME_PATH" npx --yes lighthouse@13.6.0 http://127.0.0.1:3000 --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=html --output-path=./lighthouse-report.html --quiet
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clientflow-lighthouse-report
          path: lighthouse-report.html
          if-no-files-found: ignore
