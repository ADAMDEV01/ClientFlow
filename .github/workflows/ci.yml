name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: clientflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests, and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow?schema=public"
      AUTH_SECRET: "ci-only-secret-that-is-at-least-32-characters-long"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"
      SEED_DEMO_PASSWORD: "ci-only-demo-password"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Apply committed migrations
        run: npm run db:deploy

      - name: Seed integration database
        run: npm run db:seed

      - name: Generate initial migration preview
        run: |
          mkdir -p /tmp/clientflow-migration
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > /tmp/clientflow-migration/migration.sql

      - name: Upload migration preview
        uses: actions/upload-artifact@v4
        with:
          name: schema-migration-${{ github.sha }}
          path: /tmp/clientflow-migration/migration.sql
          if-no-files-found: error
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/clientflow?schema=public"
      AUTH_SECRET: "ci-only-secret-that-is-at-least-32-characters-long"
      AUTH_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
